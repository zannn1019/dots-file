# ════════════════════════════════════════════════════════════════════════════
#  HYPRLAND WORKSPACE TRANSITION CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════
#
#  Matching configuration for the Cover/Stacking transition in Quickshell
#  
#  Animation Style: slidefade with 20% offset
#    • New workspace slides in from right
#    • Old workspace partially slides back (20%) and fades
#    • Spring curve with moderate timing
#
#  To use: Add this to your ~/.config/hypr/hyprland.conf
#
# ════════════════════════════════════════════════════════════════════════════

# ────────────────────────────────────────────────────────────────────────────
#  WORKSPACE COVER/STACKING ANIMATION
# ────────────────────────────────────────────────────────────────────────────

animation = workspaces, 1, 6, default, slidefade 20%

# Explanation:
#   • workspaces    - Animation target
#   • 1             - Enabled
#   • 6             - Duration multiplier (matches ~600ms spring settle time)
#   • default       - Bezier curve (use 'spring' if available, or custom below)
#   • slidefade 20% - Old workspace slides back 20%, fades; new slides over

# ────────────────────────────────────────────────────────────────────────────
#  OPTIONAL: Custom Bezier Curve (Caelestia-inspired spring physics)
# ────────────────────────────────────────────────────────────────────────────
#
#  For more control, define a custom bezier that approximates
#  spring: 3.5, damping: 0.25

bezier = coverSpring, 0.22, 0.61, 0.36, 1.0

# Then use it:
# animation = workspaces, 1, 6, coverSpring, slidefade 20%

# ────────────────────────────────────────────────────────────────────────────
#  ALTERNATIVE: Slide-only (if slidefade not supported)
# ────────────────────────────────────────────────────────────────────────────

# animation = workspaces, 1, 6, coverSpring, slide

# ────────────────────────────────────────────────────────────────────────────
#  FULL ANIMATION BLOCK EXAMPLE
# ────────────────────────────────────────────────────────────────────────────

animations {
    enabled = yes
    
    # Custom beziers for spring-like motion
    bezier = coverSpring, 0.22, 0.61, 0.36, 1.0
    bezier = softOut, 0.16, 1, 0.3, 1
    
    # Workspace transitions with cover effect
    animation = workspaces, 1, 6, coverSpring, slidefade 20%
    
    # Window animations (complementary)
    animation = windows, 1, 5, softOut, slide
    animation = windowsIn, 1, 5, softOut, slide
    animation = windowsOut, 1, 4, softOut, slide
    animation = windowsMove, 1, 5, coverSpring, slide
    
    # Fade animations
    animation = fade, 1, 4, default
    animation = fadeIn, 1, 4, default
    animation = fadeOut, 1, 3, default
    
    # Border and shadow
    animation = border, 1, 4, default
    animation = shadow, 1, 4, default
}

# ────────────────────────────────────────────────────────────────────────────
#  WORKSPACE BEHAVIOR SETTINGS
# ────────────────────────────────────────────────────────────────────────────

general {
    # Enable workspace stacking behavior
    layout = dwindle
    
    # Gap settings (adjust to match your Quickshell overview spacing)
    gaps_in = 6
    gaps_out = 12
    
    # Border for active window (matches accent color)
    col.active_border = rgb(40E0D0)  # Turquoise accent
    col.inactive_border = rgba(255, 255, 255, 0.07)
    
    border_size = 2
}

# ────────────────────────────────────────────────────────────────────────────
#  NOTES
# ────────────────────────────────────────────────────────────────────────────
#
#  1. Duration multiplier (6):
#     Matches ~600ms total animation time to sync with SpringAnimation
#     settle time in QML (spring: 3.5, damping: 0.25)
#
#  2. slidefade 20%:
#     Creates the "cover" effect where:
#       - New workspace slides from right (100% → 0%)
#       - Old workspace slides back (0% → -20%) and fades (100% → ~50%)
#
#  3. Bezier curve approximation:
#     The coverSpring bezier (0.22, 0.61, 0.36, 1.0) approximates
#     the spring physics used in QML. Fine-tune if needed.
#
#  4. Testing:
#     Use `hyprctl reload` after editing to test the animation.
#     Switch workspaces with: Super+[1-9] or Super+MouseWheel
#
# ════════════════════════════════════════════════════════════════════════════
